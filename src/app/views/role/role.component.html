<div class="container my-4" style="max-width: 900px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 text-secondary"> Role List</h4>
    <button class="btn btn-primary" (click)="showForm = true" style="border-radius: 10px;">
      Add Role
    </button>
  </div>

  <c-card>
    <c-card-body>
      <table class="table table-striped table-bordered table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Role Name</th>
            <th>Permissions</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of roles">
            <td>{{ r.roleName }}</td>
            <td>
              <ul class="mb-0 ps-3">
                <li *ngFor="let perm of r.permissions">{{ perm }}</li>
              </ul>
            </td>
            <td class="text-center">
              <button
                class="btn btn-danger btn-sm"
                (click)="deleteRole(r.roleName)"
                style="border-radius: 8px;"
              >
                Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="roles.length === 0">
            <td colspan="3" class="text-center text-muted">No roles found.</td>
          </tr>
        </tbody>
      </table>
    </c-card-body>
  </c-card>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center mt-3">
    <i class="fa fa-spinner fa-spin"></i> Loading...
  </div>

  <!-- CoreUI Modal for Adding Role -->
  <c-modal [(visible)]="showForm" size="lg" backdrop="static" keyboard="false" scrollable>
    <c-modal-header>
      <h5 class="modal-title">Create Role</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="showForm = false"></button>
    </c-modal-header>

    <c-modal-body>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="roleName"
        placeholder="Enter Role Name"
        style="border-radius: 10px;"
      />
      <div *ngIf="errorMessage" class="text-danger mt-2">{{ errorMessage }}</div>
    </c-modal-body>

    <c-modal-footer>
      <button class="btn btn-secondary" (click)="showForm = false">Cancel</button>
      <button
        class="btn btn-primary"
        (click)="createRole()"
        [disabled]="!roleName.trim()"
      >
        Create
      </button>
    </c-modal-footer>
  </c-modal>
</div>
