<div class="container my-4" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 text-secondary">Permission List</h4>
        <button class="btn btn-primary" (click)="showForm = true" style="border-radius: 10px;">
            Add Permission
        </button>
    </div>
    <c-card>
        <c-card-body>

            <table class="table table-striped table-hover">
                <thead class="table-hover">
                    <tr>
                        <th>#</th>
                        <th>Permission Name</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr
                        *ngFor="let p of permissions | paginate:{ itemsPerPage: itemsPerPage, currentPage: page }; let i = index">
                        <td>{{ i + 1 + (page-1)*itemsPerPage }}</td>
                        <td>{{ p }}</td>
                        <td class="text-center">
                            <span style="cursor: pointer; color: #dc3545; font-size: 1.2rem;" title="ሰርዝ"
                                (click)="deletePermission(p)">
                                🗑️
                            </span>
                        </td>

                    </tr>
                    <tr *ngIf="permissions.length === 0">
                        <td colspan="3" class="text-center text-muted">No permissions found.</td>
                    </tr>
                </tbody>
            </table>
            <pagination-controls (pageChange)="page = $event" [autoHide]="true" [previousLabel]="'ከዚህ ቀደም ገጽ'"
                [nextLabel]="'ቀጣይ ገጽ'" class="mt-2"></pagination-controls>


        </c-card-body>
    </c-card>
    <div *ngIf="isLoading" class="text-center mt-3">
        <i class="fa fa-spinner fa-spin"></i> Loading...
    </div>


    <c-modal [(visible)]="showForm" backdrop="static" keyboard="false" scrollable>

        <c-modal-header>
            <h5 class="modal-title">Create Permission</h5>
            <button type="button" class="btn-close" aria-label="Close" (click)="showForm = false"></button>
        </c-modal-header>

        <c-modal-body>
            <input type="text" class="form-control" [(ngModel)]="permissionName" placeholder="Enter Permission Name"
                style="border-radius: 10px;" />
            <div *ngIf="errorMessage" class="text-danger mt-2">{{ errorMessage }}</div>
        </c-modal-body>

        <c-modal-footer>
            <button class="btn btn-secondary" (click)="showForm = false">ዝጋ</button>
            <button class="btn btn-primary" (click)="createPermission()" [disabled]="!permissionName.trim()">
                መዝግብ
            </button>
        </c-modal-footer>
    </c-modal>
</div>
