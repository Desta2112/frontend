<c-row class="g-4">

  <!-- ACTIVE USERS -->
  <c-col sm="6" xl="3">
    <c-widget-stat-a color="primary" title="Active Users">
      <ng-template cTemplateId="widgetValueTemplate">
        <div class="fs-4 fw-semibold">
          {{ activeUsers }}
        </div>
      </ng-template>

      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart class="mt-3 mx-3" height="70" type="line"></c-chart>
      </ng-template>
    </c-widget-stat-a>
  </c-col>

  <!-- INACTIVE USERS -->
  <c-col sm="6" xl="3">
    <c-widget-stat-a color="danger" title="Inactive Users">
      <ng-template cTemplateId="widgetValueTemplate">
        <div class="fs-4 fw-semibold">
          {{ inactiveUsers }}
        </div>
      </ng-template>

      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart class="mt-3 mx-3" height="70" type="line"></c-chart>
      </ng-template>
    </c-widget-stat-a>
  </c-col>

  <!-- APPROVED COURSES -->
  <c-col sm="6" xl="3">
    <c-widget-stat-a color="success" title="Approved Courses">
      <ng-template cTemplateId="widgetValueTemplate">
        <div class="fs-4 fw-semibold">
          {{ approvedCourses }}
        </div>
      </ng-template>

      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart class="mt-3 mx-3" height="70" type="line"></c-chart>
      </ng-template>
    </c-widget-stat-a>
  </c-col>

  <!-- PENDING COURSES -->
  <c-col sm="6" xl="3">
    <c-widget-stat-a color="warning" title="Pending Courses">
      <ng-template cTemplateId="widgetValueTemplate">
        <div class="fs-4 fw-semibold">
          {{ pendingCourses }}
        </div>
      </ng-template>

      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart class="mt-3 mx-3" height="70" type="line"></c-chart>
      </ng-template>
    </c-widget-stat-a>
  </c-col>

</c-row>
